name: Bug in a mod
description: A mod does not work or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Security problems go through a private report instead (see the links when you open a new issue).
  - type: input
    id: mod
    attributes:
      label: Which mod?
      placeholder: last-look
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`. Mods need 2.1.287 or newer.
      placeholder: 2.1.293
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where were you using it?
      options: [Terminal, Desktop app (Code tab), VS Code extension, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: macOS 15, Ghostty
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install with /plugin install ...
        2. Ask Claude to ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps a lot. Remove any secrets, tokens or private paths first.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `/reload-plugins` or restarted Claude Code, and it still happens.
        - label: It still happens with only this mod installed (or I listed the other mods above).
