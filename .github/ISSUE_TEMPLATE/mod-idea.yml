name: Mod idea
description: Suggest a mod, or propose one you want to build
labels: [mod-idea]
body:
  - type: markdown
    attributes:
      value: Check the [catalogue](https://github.com/modmyclaude/claude-code-mods#the-mods) first, in case a mod already covers it.
  - type: textarea
    id: what
    attributes:
      label: What should it do?
      description: Describe what you would see or what would change in Claude Code. Plain words are perfect.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would people want it?
  - type: input
    id: seen
    attributes:
      label: Where did you see people ask for this?
      description: A link helps most (a Claude Code issue, a thread, a post). Leave it empty if it is your own wish.
      placeholder: https://
  - type: dropdown
    id: surface
    attributes:
      label: Where would it show?
      description: A mod can draw a line above the prompt, a pane beside the chat, the status line, a toast, or nothing at all.
      options: [Terminal, Desktop app (Code tab), Both, Nothing to show, Not sure]
  - type: textarea
    id: sketch
    attributes:
      label: A sketch, a screenshot or a link
      description: Anything that shows what you mean. A rough text sketch of the line or pane is enough; drag an image in if you have one.
  - type: dropdown
    id: reach
    attributes:
      label: What would it need to reach?
      description: Pick everything that applies. Less reach makes for an easier review.
      multiple: true
      options: [Display only, Reads files, Writes files, Runs commands, Calls a model, Network, Plays sound, Not sure]
  - type: dropdown
    id: build
    attributes:
      label: Do you want to build it?
      options: ["Yes, I will open a pull request", "No, only the idea"]
